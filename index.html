<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotel Options | White Sand Holidays</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F5F9F9;--surface:#fff;--ink:#0B2E36;--muted:#5B7479;--sea:#0F6E75;--sea-soft:#DCEEEF;--gold:#B8892B;--line:#D3E2E4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1C21;--surface:#112A31;--ink:#E8F2F3;--muted:#93AEB3;--sea:#4FB7BE;--sea-soft:#17353C;--gold:#E0B25A;--line:#234650}}
:root[data-theme="dark"]{--bg:#0A1C21;--surface:#112A31;--ink:#E8F2F3;--muted:#93AEB3;--sea:#4FB7BE;--sea-soft:#17353C;--gold:#E0B25A;--line:#234650}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{padding:28px 0 8px}
.brand{font-size:14px;color:var(--muted);margin:0 0 6px}
h1{font:400 clamp(30px,8vw,44px)/1.1 "DM Serif Display",Georgia,serif;margin:0 0 8px}
.sub{color:var(--muted);margin:0;max-width:46ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 0 10px;z-index:5}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.lab{font-size:13px;color:var(--muted);margin:8px 0 2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px "DM Sans",sans-serif;padding:10px 18px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.chip:focus-visible,.btn:focus-visible,.lb button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:18px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center;cursor:zoom-in;display:block}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sea);width:20px;border-radius:4px}
.info{padding:14px 18px 20px}
.info h2{font:400 26px/1.2 "DM Serif Display",Georgia,serif;margin:0 0 4px}
.room{color:var(--gold);font-weight:700;margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.tags li{background:var(--sea-soft);color:var(--sea);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:15px;padding:12px 20px;border-radius:12px;background:var(--sea);color:#fff}
.btn.alt{background:transparent;color:var(--sea);border:1.5px solid var(--sea)}
.soon{margin-top:18px;border:1.5px dashed var(--line);border-radius:18px;padding:32px 20px;text-align:center;color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;font:700 15px "DM Sans",sans-serif;background:#fff;color:#0B2E36;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
</style></head><body>

<header>
<p class="brand">White Sand Holidays</p>

var CATS=["Budget","Standard","Premium","Luxury"];
var LOCS=["Port Blair","Havelock","Neil"];
var HOTELS={"Premium|Neil":[{n:"Aquays Neil",r:"Neil Plaza room",t:["Swimming pool","Sea side"],img:IMGS,v:"https://youtu.be/ky0rzcAA5wA?si=QhRiTgjtu5OH_hSK",g:"https://share.google/XTW927NOqIowMPrH3"}]};
var cat="Premium",loc="Neil";
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function chips(id,list,cur,set){var box=document.getElementById(id);box.innerHTML="";list.forEach(function(v){var b=el("button","chip",v);b.setAttribute("aria-pressed",v===cur);b.onclick=function(){set(v);render()};box.appendChild(b)})}
function card(h){
var c=el("article","card"),g=el("div","gal");
h.img.forEach(function(s,i){var im=el("img");im.src=s;im.alt=h.n+" photo "+(i+1);im.onclick=function(){document.getElementById("lbi").src=s;document.getElementById("lb").classList.add("open")};g.appendChild(im)});
var d=el("div","dots");h.img.forEach(function(_,i){d.appendChild(el("i",i?"":"on"))});
g.onscroll=function(){var k=Math.round(g.scrollLeft/g.clientWidth);[].forEach.call(d.children,function(x,i){x.className=i===k?"on":""})};
c.appendChild(g);c.appendChild(d);
var f=el("div","info");f.appendChild(el("h2","",h.n));f.appendChild(el("p","room",h.r));
var u=el("ul","tags");h.t.forEach(function(x){u.appendChild(el("li","",x))});f.appendChild(u);
var a=el("div","acts");
if(h.v){var v=el("a","btn","Watch video");v.href=h.v;v.target="_blank";v.rel="noopener";a.appendChild(v)}
if(h.g){var m=el("a","btn alt","View on Google");m.href=h.g;m.target="_blank";m.rel="noopener";a.appendChild(m)}
f.appendChild(a);c.appendChild(f);return c}
function render(){
chips("cats",CATS,cat,function(v){cat=v});chips("locs",LOCS,loc,function(v){loc=v});
var out=document.getElementById("out");out.innerHTML="";
var list=HOTELS[cat+"|"+loc];
if(list){list.forEach(function(h){out.appendChild(card(h))})}
else{out.appendChild(el("div","soon","Hotels for "+cat+" in "+loc+" will appear here soon."))}}
document.getElementById("lb").onclick=function(){this.classList.remove("open")};
render();
</script></body></html>
